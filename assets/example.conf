# sample hyprdictate.conf
# for more configuration options, refer https://github.com/da-shalev/hyprdictate

general {
    # A streaming transcribe.cpp GGUF, e.g. Nemotron 3.5 ASR Streaming from
    # https://huggingface.co/handy-computer/nemotron-3.5-asr-streaming-0.6b-gguf
    model = ~/models/nemotron-3.5-asr-streaming-0.6b-Q8_0.gguf

    # Language code the model expects (`en` for English-only models).
    language = en-US

    # How soon words appear after you say them, in milliseconds: lower is
    # quicker, higher more accurate. A model rejects a value it was not
    # trained on (Nemotron 3.5: 0, 240, 480, 1040). -1 keeps its default.
    latency = 480
}
